name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure and Build AVM
      run: |
        # 1. Target the repository folder name directly inside the workspace
        $TargetDir = Join-Path $env:GITHUB_WORKSPACE "https-github.com-AOMediaCodec-avm"
        
        # Fallback to current working directory if the nested naming structure varies
        if (-not (Test-Path "$TargetDir\CMakeLists.txt")) {
            $TargetDir = $env:GITHUB_WORKSPACE
        }
        
        Write-Output "Targeting source directory: $TargetDir"
        cd "$TargetDir"
        
        # 2. Configure CMake locally
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        
        # 3. Compile the project 
        cmake --build build --config Release --parallel
