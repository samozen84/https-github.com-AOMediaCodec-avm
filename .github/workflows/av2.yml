name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Force secure workspace isolation layout to guarantee execution permissions
    - name: Execute Full Sandbox Build Sequence
      run: |
        # 1. Bypass strict directory ownership restrictions inside script runtimes
        git config --global --add safe.directory '*'
        
        # 2. Re-route paths onto the primary storage partition 
        $SandboxRoot = Join-Path "D:\" "scratch"
        $SandboxedSrc = Join-Path $SandboxRoot "csrc"
        $SandboxedBuild = Join-Path $SandboxRoot "cbuild"
        
        # 3. Securely instantiate pure alphanumeric destination trees
        New-Item -ItemType Directory -Force -Path $SandboxedSrc
        New-Item -ItemType Directory -Force -Path $SandboxedBuild
        
        Write-Output "Cloning target codebase natively..."
        git clone --recursive https://github.com "$SandboxedSrc"
        
        Write-Output "Generating project definitions with CMake..."
        cmake -S "$SandboxedSrc" -B "$SandboxedBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        
        Write-Output "Compiling production binaries..."
        cmake --build "$SandboxedBuild" --config Release --parallel
