name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Pull down the target source code natively into the workspace
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'raw_source'
        submodules: 'recursive'

    # 2. Duplicate code into an absolute, symbol-free physical directory to compile safely
    - name: Configure and Build AVM
      run: |
        # Create physical folders directly in the user profile area to avoid any 'avm' string matches
        $PhysicalSrc = "C:\Users\runneradmin\srcdir"
        $PhysicalBuild = "C:\Users\runneradmin\builddir"
        
        # Instantiate the directories on the drive partition
        New-Item -ItemType Directory -Force -Path $PhysicalSrc
        New-Item -ItemType Directory -Force -Path $PhysicalBuild
        
        # Physically copy the files over to the pristine user space path
        Write-Output "Staging files to user profile space..."
        Copy-Item -Path "$env:GITHUB_WORKSPACE\raw_source\*" -Destination $PhysicalSrc -Recurse -Force
        
        # Generate Visual Studio solutions targeting the symbol-free absolute paths
        Write-Output "Configuring project with CMake..."
        cmake -S "$PhysicalSrc" -B "$PhysicalBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # Compile optimized production binaries
        Write-Output "Compiling production targets..."
        cmake --build "$PhysicalBuild" --config Release --parallel
        
        # Move the compiled binaries back to the runner workspace for tracking
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "$PhysicalBuild\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "$PhysicalBuild\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
