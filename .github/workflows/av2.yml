name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        $ToolsDir = Join-Path $env:USERPROFILE "tools"
        New-Item -ItemType Directory -Force -Path $ToolsDir
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$ToolsDir\yasm.exe"
        echo "$ToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Pull down the codebase files securely into a standard temporary workspace folder
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'raw-source'
        submodules: 'recursive'

    # 2. Stage and build within a pristine alphanumeric directory to clear all path matching loops
    - name: Configure and Build AVM
      run: |
        # Define absolute folders inside the Temp partition, keeping paths completely clear of the word "avm"
        $SanitizedSrc = Join-Path $env:RUNNER_TEMP "buildsrc"
        $SanitizedBuild = Join-Path $env:RUNNER_TEMP "buildout"
        
        # Instantiate pristine workspace trees on the storage partition drive
        New-Item -ItemType Directory -Force -Path $SanitizedSrc
        New-Item -ItemType Directory -Force -Path $SanitizedBuild
        
        Write-Output "Staging source files cleanly using Robocopy..."
        
        # Wrap robocopy execution to prevent PowerShell from instantly failing on exit codes 1-7
        & robocopy "$env:GITHUB_WORKSPACE\raw-source" "$SanitizedSrc" /E /R:1 /W:1 /NFL /NDL /NJH /NJS
        $RoboStatus = $LASTEXITCODE
        
        if ($RoboStatus -lt 8) {
            Write-Output "Robocopy structural mirror completed successfully with status: $RoboStatus"
            $global:LASTEXITCODE = 0
        } else {
            Write-Error "Robocopy failed with a fatal error code: $RoboStatus"
            exit $RoboStatus
        }
        
        # Run project configuration using completely sanitized destination maps
        Write-Output "Configuring project with CMake..."
        cmake -S "$SanitizedSrc" -B "$SanitizedBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # Compile static optimized production binaries
        Write-Output "Compiling production targets..."
        cmake --build "$SanitizedBuild" --config Release --parallel
        
        # Safe staging step to extract compiled applications back to the workspace for download
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        if (Test-Path "$SanitizedBuild\Release\avmenc.exe") {
            Copy-Item "$SanitizedBuild\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
            Copy-Item "$SanitizedBuild\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        }

    # Uploads the artifacts directly out of the staged local workspace folder
    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
