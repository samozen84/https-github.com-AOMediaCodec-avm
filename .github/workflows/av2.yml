name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Run everything entirely inside isolated storage contexts on the D:\ partition drive
    - name: Configure and Build AVM
      run: |
        # 1. Clear out potential Git path ownership verification checks
        git config --global --add safe.directory '*'
        
        # 2. Hardcode clean, purely alphanumeric paths straight onto the open D:\ drive partition
        $IsolatedSrc = "D:\scratch_src"
        $IsolatedBuild = "D:\scratch_build"
        
        # 3. Pull down the upstream codebase natively into the clean storage space
        Write-Output "Cloning codebase into isolated D:\ target directory..."
        git clone --recursive https://github.com "$IsolatedSrc"
        
        # 4. Initialize build files on the separate path location
        Write-Output "Configuring project with CMake..."
        New-Item -ItemType Directory -Force -Path "$IsolatedBuild"
        cmake -S "$IsolatedSrc" -B "$IsolatedBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # 5. Compile optimized binaries
        Write-Output "Compiling production targets..."
        cmake --build "$IsolatedBuild" --config Release --parallel
        
        # 6. Extract the freshly generated executables back to the GITHUB_WORKSPACE for artifact tracking
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "$IsolatedBuild\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "$IsolatedBuild\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
