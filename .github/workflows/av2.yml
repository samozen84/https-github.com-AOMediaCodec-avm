name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Clone into a custom directory path that does NOT contain the string "avm"
    - name: Fetch Target Codebase cleanly
      run: |
        git clone --recursive https://github.com C:\codec_src

    # 2. Configure and generate out to a generic companion output folder path
    - name: Configure CMake Externally
      run: |
        New-Item -ItemType Directory -Force -Path "C:\codec_build"
        cmake -S "C:\codec_src" -B "C:\codec_build" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"

    - name: Build AVM Reference Software
      run: |
        cmake --build "C:\codec_build" --config Release --parallel
