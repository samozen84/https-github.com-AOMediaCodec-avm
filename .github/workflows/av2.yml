name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Install assembler to a neutral, system-accessible tools directory
    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 2. Force download and build phases directly inside the temporary OS partition path
    - name: Execute Full Sandbox Build Sequence
      run: |
        # Define clean, symbol-free directory variables inside the OS Temp partition
        $SandboxedSrc = Join-Path $env:RUNNER_TEMP "csrc"
        $SandboxedBuild = Join-Path $env:RUNNER_TEMP "cbuild"
        
        Write-Output "Cloning target source into: $SandboxedSrc"
        git clone --recursive https://github.com "$SandboxedSrc"
        
        Write-Output "Generating build files into: $SandboxedBuild"
        New-Item -ItemType Directory -Force -Path "$SandboxedBuild"
        
        # Configure and compile entirely within the safe partition layout
        cmake -S "$SandboxedSrc" -B "$SandboxedBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        cmake --build "$SandboxedBuild" --config Release --parallel
