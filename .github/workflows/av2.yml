name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'source_files'
        submodules: 'recursive'

    # Route paths through a clean virtual drive to hide any forbidden parent folder naming matches
    - name: Configure and Build AVM
      run: |
        # 1. Create independent source and build tracking paths inside the user profile space
        $RealSrc = "$env:GITHUB_WORKSPACE\source_files"
        $RealBuild = Join-Path $env:USERPROFILE "build_files"
        New-Item -ItemType Directory -Force -Path $RealBuild
        
        # 2. Map virtual drives to completely obscure the original workspace string name
        subst S: "$RealSrc"
        subst B: "$RealBuild"
        
        # 3. Configure CMake targeting the root directory of the virtual drives
        cmake -S "S:\" -B "B:\" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # 4. Compile the binaries
        cmake --build "B:\" --config Release --parallel
        
        # 5. Extract and stage the freshly generated executables back to the workspace root
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "B:\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "B:\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        
        # 6. Clean up mapped virtual drive paths
        subst S: /D
        subst B: /D

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
