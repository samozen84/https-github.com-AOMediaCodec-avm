name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        $ToolsDir = Join-Path $env:USERPROFILE "tools"
        New-Item -ItemType Directory -Force -Path $ToolsDir
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$ToolsDir\yasm.exe"
        echo "$ToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Native checkout directly into a valid workspace subdirectory layout
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'clean_src'
        submodules: 'recursive'

    # 2. Configure and build using the dedicated CMake bypass flag parameter
    - name: Configure and Build AVM
      run: |
        # Force the configuration files to generate inside a dedicated companion folder
        $AbsoluteBuildPath = "$env:TEMP\codecbuild"
        New-Item -ItemType Directory -Force -Path $AbsoluteBuildPath
        
        Write-Output "Configuring project with CMake..."
        # -DALLOW_IN_SOURCE_BUILD=1 forces the compiler to ignore the repository name string check loops completely
        cmake -S "$env:GITHUB_WORKSPACE\clean_src" -B "$AbsoluteBuildPath" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0 -DALLOW_IN_SOURCE_BUILD=1
        
        Write-Output "Compiling production targets..."
        cmake --build "$AbsoluteBuildPath" --config Release --parallel
        
        # Move the completed executables back to a local workspace directory for artifact tracking
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        if (Test-Path "$AbsoluteBuildPath\Release\avmenc.exe") {
            Copy-Item "$AbsoluteBuildPath\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
            Copy-Item "$AbsoluteBuildPath\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        }

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
