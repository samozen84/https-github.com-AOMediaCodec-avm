name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Fetch Target Codebase into a clean alphanumeric subdirectory
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'csrc'
        submodules: 'recursive'

    # 2. Configure and build using an absolute, symbol-free temporary directory
    - name: Configure and Build AVM
      run: |
        # Configure using the isolated temp drive path to bypass all parent path naming blocks
        cmake -S . -B "$env:RUNNER_TEMP\cbuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
        
        # Compile the source binaries
        cmake --build "$env:RUNNER_TEMP\cbuild" --config Release --parallel
      working-directory: csrc
