name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Clear workflow runner permissions by pulling down your repository context first
    - name: Checkout Workflow Configuration
      uses: actions/checkout@v4

    # 2. Checkout the true AVM target source files with structural integrity
    - name: Checkout AVM Reference Source Code
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'avm_src'
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$env:USERPROFILE\tools\yasm.exe"
        echo "$env:USERPROFILE\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 3. Configure and compile using standardized relative working-directory variables
    - name: Configure CMake
      run: |
        mkdir ../avm_build
        cmake -S . -B ../avm_build -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"
      working-directory: avm_src

    - name: Build AVM Reference Software
      run: cmake --build ../avm_build --config Release --parallel
      working-directory: avm_src
