name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Standardize checkout to grab the files cleanly into the root workspace
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        submodules: 'true'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 2. Shift into a completely separate scratch directory on the runner to build
    - name: Configure CMake Externally
      run: |
        cd ..
        mkdir avm_build_dir
        cmake -S https-github.com-AOMediaCodec-avm -B avm_build_dir -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"

    # 3. Compile the binaries out of the clean scratch directory
    - name: Build AVM Reference Software
      run: |
        cd ..
        cmake --build avm_build_dir --config Release --parallel
