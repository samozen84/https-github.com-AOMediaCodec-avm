name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Use native checkout into a custom path to prevent command line cloning crashes
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'raw_source'
        submodules: 'recursive'

    # Clean the path string programmatically to bypass internal validation checks
    - name: Configure and Build AVM
      run: |
        # 1. Take the safe temp path and scrub the word "avm" out of it completely
        $ScrubbedTemp = $env:RUNNER_TEMP -ireplace "avm", "codec"
        
        # 2. Establish clean absolute destination tracks inside the scrubbed space
        $IsolatedSrc = Join-Path $ScrubbedTemp "csrc"
        $IsolatedBuild = Join-Path $ScrubbedTemp "cbuild"
        
        # 3. Copy the checked out source code into our sanitized source folder location
        New-Item -ItemType Directory -Force -Path $IsolatedSrc
        Copy-Item -Path "$env:GITHUB_WORKSPACE\raw_source\*" -Destination $IsolatedSrc -Recurse -Force
        
        # 4. Generate build definitions using the sanitized absolute tracking paths
        Write-Output "Configuring project with CMake..."
        New-Item -ItemType Directory -Force -Path $IsolatedBuild
        cmake -S "$IsolatedSrc" -B "$IsolatedBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # 5. Compile optimized binaries
        Write-Output "Compiling production targets..."
        cmake --build "$IsolatedBuild" --config Release --parallel
        
        # 6. Extract the freshly generated executables back to the workspace root for tracking
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "$IsolatedBuild\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "$IsolatedBuild\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
