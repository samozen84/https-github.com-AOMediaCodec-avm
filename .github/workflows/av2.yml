name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure and Build AVM (Unified Session)
      run: |
        # 1. Locate the subfolder containing CMakeLists.txt
        $SrcDir = (Get-ChildItem -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1).DirectoryName
        Write-Output "Found source directory at: $SrcDir"
        
        # 2. Change location into that directory explicitly
        cd "$SrcDir"
        
        # 3. Configure CMake locally inside this active session context
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        
        # 4. Compile the project while still inside the tracking directory loop
        cmake --build build --config Release --parallel
