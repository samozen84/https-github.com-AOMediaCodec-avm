name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        $ToolsDir = Join-Path $env:USERPROFILE "tools"
        New-Item -ItemType Directory -Force -Path $ToolsDir
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$ToolsDir\yasm.exe"
        echo "$ToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Pull down the codebase files securely using GitHub's native framework engine
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'src_tree'
        submodules: 'recursive'

    # 2. Map a safe symbolic path context and run the CMake toolchain compilation passes
    - name: Configure and Build AVM
      run: |
        # Override the error mode layout explicitly inside this local terminal scope
        $ErrorActionPreference = 'SilentlyContinue'
        
        # Establish a completely anonymous pathway configuration tracking location
        $CleanSrc = Join-Path $env:RUNNER_TEMP "csrc"
        $CleanBuild = Join-Path $env:RUNNER_TEMP "cbuild"
        
        # Create a directory symlink to mirror files into the safe partition instantly without tracking warnings
        cmd /c mklink /D "$CleanSrc" "$env:GITHUB_WORKSPACE\src_tree"
        New-Item -ItemType Directory -Force -Path $CleanBuild
        
        # Reset standard terminal tracking behaviors for the compilation engine
        $ErrorActionPreference = 'Stop'
        
        # Run project configuration using completely sanitized destination maps
        Write-Output "Configuring project with CMake..."
        cmake -S "$CleanSrc" -B "$CleanBuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # Compile static optimized production binaries
        Write-Output "Compiling production targets..."
        cmake --build "$CleanBuild" --config Release --parallel
        
        # Extract compiled applications back to the workspace for tracking upload steps
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        if (Test-Path "$CleanBuild\Release\avmenc.exe") {
            Copy-Item "$CleanBuild\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
            Copy-Item "$CleanBuild\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        }

    # Uploads the artifacts directly out of the staged local workspace folder
    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
