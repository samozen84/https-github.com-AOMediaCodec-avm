name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$env:USERPROFILE\tools\yasm.exe"
        echo "$env:USERPROFILE\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Run the entire build sequence inside the user's secure absolute temp profile space
    - name: Configure and Build AVM
      run: |
        # 1. Establish clean paths inside the local user profile space (alters path profile from forbidden workspace naming loops)
        $SrcDir = Join-Path $env:USERPROFILE "LocalTempSrc"
        $BuildDir = Join-Path $env:USERPROFILE "LocalTempBuild"
        
        # 2. Clone the target codebase natively with full submodule support
        Write-Output "Fetching AVM target codebase into user space..."
        git clone --recursive https://github.com "$SrcDir"
        
        # 3. Initialize build definitions using absolute paths
        Write-Output "Configuring project with CMake..."
        New-Item -ItemType Directory -Force -Path "$BuildDir"
        cmake -S "$SrcDir" -B "$BuildDir" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # 4. Compile optimized binaries
        Write-Output "Compiling production targets..."
        cmake --build "$BuildDir" --config Release --parallel
        
        # 5. Safe staging step to move finished binaries back to the runner workspace for upload
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "$BuildDir\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "$BuildDir\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"

    # Uploads the artifacts directly out of the staged local workspace folder
    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
