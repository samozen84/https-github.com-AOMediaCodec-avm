name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Native checkout into a pure alphanumeric folder to hide the hyphens and periods
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'codecsource'
        submodules: 'recursive'

    # 2. Configure and Build outside the source tree using a clean target structure
    - name: Configure and Build AVM
      run: |
        # Explicitly build inside the user profile temp folder to satisfy all isolation rules
        $TargetBuildDir = Join-Path $env:USERPROFILE "codecmaps"
        
        Write-Output "Generating build definitions..."
        cmake -S "$env:GITHUB_WORKSPACE\codecsource" -B "$TargetBuildDir" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        Write-Output "Compiling production binaries..."
        cmake --build "$TargetBuildDir" --config Release --parallel
        
        # Staging directory loop for safe runner packaging
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\avm_binaries"
        Copy-Item "$TargetBuildDir\Release\avmenc.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"
        Copy-Item "$TargetBuildDir\Release\avmdec.exe" -Destination "$env:GITHUB_WORKSPACE\avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
