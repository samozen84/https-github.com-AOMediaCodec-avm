name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Complete cloning, configuration, and compilation sandbox process on a clean alphanumeric C:\ path structure
    - name: Configure and Build AVM
      run: |
        # 1. Clear out potential pre-existing security permission hooks
        git config --global --add safe.directory '*'
        
        # 2. Establish clean absolute system path mappings completely clear of the repository name symbols
        $SrcDir = "C:\csrc"
        $BuildDir = "C:\cbuild"
        
        # 3. Pull down the target repository files along with structural submodules cleanly via native git execution
        Write-Output "Fetching AVM target codebase..."
        git clone --recursive https://github.com "$SrcDir"
        
        # 4. Initialize and output the build definition layout maps
        Write-Output "Configuring project with CMake..."
        New-Item -ItemType Directory -Force -Path "$BuildDir"
        cmake -S "$SrcDir" -B "$BuildDir" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # 5. Compile the static optimized binary executables
        Write-Output "Compiling production targets..."
        cmake --build "$BuildDir" --config Release --parallel

    - name: Prepare Artifacts
      run: |
        New-Item -ItemType Directory -Force -Path "avm_binaries"
        Copy-Item "C:\cbuild\Release\avmenc.exe" -Destination "avm_binaries\"
        Copy-Item "C:\cbuild\Release\avmdec.exe" -Destination "avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
