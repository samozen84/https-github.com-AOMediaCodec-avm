name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "$env:SystemDrive\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$env:SystemDrive\tools\yasm.exe"
        echo "$env:SystemDrive\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Standardize path formats using PowerShell variables to clear Git system mapping issues
    - name: Clone AVM Reference Source Code Sanely
      run: |
        $SrcPath = Join-Path $env:SystemDrive "avm_src"
        git clone --recursive --depth 1 https://github.com "$SrcPath"

    # 2. Complete setup loops using verified absolute drive variable layouts
    - name: Configure CMake Externally
      run: |
        $SrcPath = Join-Path $env:SystemDrive "avm_src"
        $BuildPath = Join-Path $env:SystemDrive "avm_build"
        New-Item -ItemType Directory -Force -Path "$BuildPath"
        
        cmake -S "$SrcPath" -B "$BuildPath" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe"

    - name: Build AVM Reference Software
      run: |
        $BuildPath = Join-Path $env:SystemDrive "avm_build"
        cmake --build "$BuildPath" --config Release --parallel
