name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'csrc'
        submodules: 'recursive'

    # Unified execution utilizing exact directory mapping keys to avoid terminal path tracking confusion
    - name: Configure and Build AVM
      run: |
        # Generate the visual studio project out to a clean folder using absolute parameters
        cmake -S "$env:GITHUB_WORKSPACE\csrc" -B "$env:RUNNER_TEMP\cbuild" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        # Build the binaries directly from the target folder location
        cmake --build "$env:RUNNER_TEMP\cbuild" --config Release --parallel

    - name: Prepare Artifacts
      run: |
        New-Item -ItemType Directory -Force -Path "avm_binaries"
        Copy-Item "$env:RUNNER_TEMP\cbuild\Release\avmenc.exe" -Destination "avm_binaries\"
        Copy-Item "$env:RUNNER_TEMP\cbuild\Release\avmdec.exe" -Destination "avm_binaries\"

    - name: Upload Compiled AVM Binaries
      uses: actions/upload-artifact@v4
      with:
        name: avm-windows-x64-binaries
        path: avm_binaries/
