name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Check out the AVM source code into an isolated subdirectory named 'avm_source'
    - name: Checkout AVM Reference Source Code
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'avm_source'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 2. Build out from an external folder location ('avm_build') to satisfy the CMake rules
    - name: Configure CMake Externally
      run: |
        mkdir avm_build
        cmake -S avm_source -B avm_build -G "Visual Studio 17 2022" -A x64

    - name: Build AVM Reference Software
      run: cmake --build avm_build --config Release --parallel
