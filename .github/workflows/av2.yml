name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Yasm manually
      run: |
        New-Item -ItemType Directory -Force -Path "C:\tools"
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "C:\tools\yasm.exe"
        echo "C:\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Diagnose Directory and Run Build
      run: |
        # 1. Print out the directory map to the logs so we can see what exists
        Write-Output "=== Current Root Directory Contents ==="
        Get-ChildItem -Path $env:GITHUB_WORKSPACE
        
        # 2. Check if the code is hidden inside a specific nested folder name
        $NestFolder = "https-github.com-AOMediaCodec-avm"
        if (Test-Path "$env:GITHUB_WORKSPACE\$NestFolder\CMakeLists.txt") {
            cd "$env:GITHUB_WORKSPACE\$NestFolder"
        } elseif (Test-Path "$env:GITHUB_WORKSPACE\CMakeLists.txt") {
            cd $env:GITHUB_WORKSPACE
        } else {
            # Find any folder that actually has the CMakeLists.txt file to save the build
            $FoundFile = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "CMakeLists.txt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($FoundFile) {
                cd $FoundFile.DirectoryName
            } else {
                Write-Error "Could not find CMakeLists.txt anywhere in the workspace!"
                exit 1
            }
        }
        
        Write-Output "=== Executing Build from: $(Get-Location) ==="
        
        # 3. Safe Configuration and Compilation pass
        cmake -S . -B build_dir -G "Visual Studio 17 2022" -A x64
        cmake --build build_dir --config Release --parallel
